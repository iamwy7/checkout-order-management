  mysql:
    image: mysql:8.0.30-debian
    restart: always
    environment:
      MYSQL_DATABASE: distribution_centers_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
     - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - distribution_centers_network
    volumes:
      - ./.docker/mysql-init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  mysql-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "9090:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - distribution_centers_network
    depends_on:
      - mysql

networks:
  distribution_centers_network:

volumes:
  db_data: