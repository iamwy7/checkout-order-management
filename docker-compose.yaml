services:

  orders:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: orders_mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: orders_db
      DC_URL: distribution_centers
      DC_PORT: 8081
    networks:
      - orders_network
      - distribution_centers_network
    depends_on:
      - orders_mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # wiremock:
  #   image: wiremock/wiremock:latest
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./test/wiremock/mappings:/home/wiremock/mappings
  #     - ./test/wiremock/__files:/home/wiremock/__files
  #   networks:
  #     - orders_network

  orders_mysql:
    image: mysql:8.0.30-debian
    restart: always
    environment:
      MYSQL_DATABASE: orders_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
     - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - orders_network
    volumes:
      - ./.docker/mysql-init:/docker-entrypoint-initdb.d
      - orders_db_data:/var/lib/mysql

  orders_mysql-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "9090:80"
    environment:
      PMA_HOST: orders_mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - orders_network
    depends_on:
      - orders_mysql

